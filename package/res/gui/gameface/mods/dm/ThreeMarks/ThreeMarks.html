<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="ThreeMarks.css">
</head>
<body>
  <div id="tm-panel">
    <span id="tm-pct">--.--%</span>
    <div id="tm-arrow"></div>
    <div class="tm-run" id="tm-delta"></div>
    <div id="tm-cap0"></div>
    <div id="tm-cap100"></div>
    <div id="tm-track">
      <div id="tm-fill"></div>
    </div>
    <div id="tm-tick"></div>
    <div id="tm-title"></div>
    <div id="tm-valwrap">
      <div class="tm-run" id="tm-val"></div>
      <div class="tm-run" id="tm-need"></div>
    </div>
    <span class="tm-star" id="tm-star1"></span>
    <span class="tm-star" id="tm-star2"></span>
    <span class="tm-star" id="tm-star3"></span>
    <div id="tm-ast">
      <div class="tm-ag" id="tm-ast-r"><div class="tm-ai" id="tm-ast-ri"></div><div class="tm-live" id="tm-ast-rv"></div></div>
      <div class="tm-ag" id="tm-ast-t"><div class="tm-ai" id="tm-ast-ti"></div><div class="tm-live" id="tm-ast-tv"></div></div>
    </div>
    <div id="tm-hsep"></div>
    <div id="tm-hema-l"></div>
    <div class="tm-run" id="tm-hema-v"></div>
    <div class="tm-run tm-hthr" id="tm-h65l"></div>
    <div class="tm-run tm-hthr" id="tm-h65v"></div>
    <div class="tm-run tm-hthr" id="tm-h85l"></div>
    <div class="tm-run tm-hthr" id="tm-h85v"></div>
    <div class="tm-run tm-hthr" id="tm-h95l"></div>
    <div class="tm-run tm-hthr" id="tm-h95v"></div>
    <div id="tm-nodata"></div>
    <div id="tm-btn"></div>
    <div id="tm-cfg"></div>
    <div id="tm-set"></div>
  </div>
  <div id="tm-v3"></div>
  <script defer src="ThreeMarks.js"></script>
</body>
</html>
